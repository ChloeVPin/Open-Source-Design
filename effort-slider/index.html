<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Effort slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- The stage is laid out at 1x and scaled up to fill the window, as in the original recording. -->
    <main class="stage js-stage">
      <section class="card js-card" aria-label="Effort">
        <header class="card__head">
          <h1 class="card__title" id="effort-label">Effort</h1>
          <p class="card__value js-value" aria-hidden="true"></p>
          <span class="card__help" title="More effort means slower, more thorough answers.">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <path d="M12 17h.01" />
            </svg>
          </span>
        </header>

        <div class="scale" aria-hidden="true"><span>Faster</span><span>Smarter</span></div>

        <div
          class="slider js-slider"
          role="slider"
          tabindex="0"
          aria-labelledby="effort-label"
          aria-valuemin="0"
          aria-valuemax="5"
          aria-valuenow="0"
          aria-valuetext="Low"
        >
          <div class="slider__track">
            <div class="slider__fill js-fill"></div>
            <canvas class="slider__mosaic js-mosaic"></canvas>
            <div class="slider__ticks js-ticks"></div>
          </div>

          <div class="thumb js-thumb">
            <!-- Brain: Lucide's "brain" icon (ISC licence), filled. -->
            <svg class="brain brain--plain" viewBox="0 0 24 24" aria-hidden="true"><use href="#brain" /></svg>
            <svg class="brain brain--galaxy" viewBox="0 0 24 24" aria-hidden="true"><use href="#brain" /></svg>
          </div>
        </div>

        <p class="hint js-hint" aria-hidden="true"></p>

        <canvas class="fx js-fx" aria-hidden="true"></canvas>
      </section>
    </main>

    <svg class="defs" aria-hidden="true">
      <defs>
        <linearGradient id="brain-galaxy" gradientUnits="userSpaceOnUse" x1="5" y1="3" x2="19" y2="22">
          <stop offset="0" stop-color="#8fb2ff" />
          <stop offset="0.5" stop-color="#9583fa" />
          <stop offset="1" stop-color="#cb70e8" />
        </linearGradient>
        <symbol id="brain" viewBox="0 0 24 24">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
          <path fill="none" d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
          <path fill="none" d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
          <path fill="none" d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
          <path fill="none" d="M3.477 10.896a4 4 0 0 1 .585-.396" />
          <path fill="none" d="M19.938 10.5a4 4 0 0 1 .585.396" />
          <path fill="none" d="M6 18a4 4 0 0 1-1.967-.516" />
          <path fill="none" d="M19.967 17.484A4 4 0 0 1 18 18" />
        </symbol>
      </defs>
    </svg>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
